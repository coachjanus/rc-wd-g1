<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product card</title>
    <link rel="stylesheet" href="css/card.css">
</head>

<body>
    <!-- Блок -->
    <div class="product-card">
        <!-- Елемент -->
        <img src="images/product-5.jpg" alt="Товар" class="product-card__image">
        <!-- Елемент -->
        <h3 class="product-card__title">Смартфон Galaxy</h3>
        <!-- Елемент з Модифікатором (акційна ціна) -->
        <span class="product-card__price product-card__price--discount">$799</span>
        <!-- Елемент-кнопка з Модифікатором (заблокована) -->
        <button class="product-card__button product-card__button--disabled" disabled>
            Немає в наявності
        </button>
    </div>
</body>

</html>
