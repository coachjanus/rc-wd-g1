<!doctype html><html lang=uk><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>TypeScript Інтернет-Магазин</title><link rel=stylesheet href=./css/style.css><script defer src=bundle.js></script></head><body><div class=filters-panel><input id=searchInput placeholder="Пошук товарів..."> <input type=number id=priceMin placeholder="Мін. ціна (грн)"> <input type=number id=priceMax placeholder="Макс. ціна (грн)"> <select id=sortSelect><option value=default>Сортування за замовчуванням<option value=price-asc>Ціна: від дешевшої<option value=price-desc>Ціна: від дорожчої</select><div class=category-group><label><input type=checkbox class=category-checkbox value=beauty> Краса</label> <label><input type=checkbox class=category-checkbox value=fragrances> Парфуми</label> <label><input type=checkbox class=category-checkbox value=groceries> Продукти</label></div><button id=clearFiltersBtn>Очистити фільтри</button></div><p>Знайдено товарів: <span id=totalProductsCount>0</span><div class=app-container><main><div id=productsContainer class=products-grid></div><div id=paginationContainer class=pagination-container></div></main><aside><div class=cart-panel><h3>Кошик (<span id=cartBadge>0</span>)</h3><div id=cartContainer><p>Кошик порожній</div><div class=cart-total-block><span>Всього:</span> <span id=cartTotal>0 грн</span></div></div><form id=orderForm class=order-form-panel><h3>Оформлення замовлення</h3><div class=form-group><label for=orderName>ПІБ *</label> <input id=orderName placeholder="Іван Іванов"> <span id=nameError class=error-text></span></div><div class=form-group><label for=orderPhone>Телефон *</label> <input id=orderPhone placeholder=+380991234567> <span id=phoneError class=error-text></span></div><div class=form-group><label for=orderEmail>Email *</label> <input type=email id=orderEmail placeholder=example@mail.com> <span id=emailError class=error-text></span></div><div class=form-group><label for=orderAddress>Адреса доставки *</label> <input id=orderAddress placeholder="м. Київ, вул. Хрещатик 1, кв. 5"> <span id=addressError class=error-text></span></div><div class=form-group><label for=orderPayment>Спосіб оплати</label> <select id=orderPayment><option value=card>Карткою на сайті<option value=cash>Готівкою при отриманні</select></div><button type=submit class=btn-submit-order>Підтвердити замовлення</button></form></aside></div><script type=module src=./dist/index.js></script></body></html>
