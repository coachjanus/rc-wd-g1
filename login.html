<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Welcome Back</h2>
                <p>Please enter your details to login</p>
            </div>
        
            <form action="/login" method="POST" id="loginForm" class="login-form" autocomplete="off" novalidate>
                <div class="form-group"> 
                    <div class="input-wrapper">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <span class="error-message" id="emailError"></span>
                </div>
                <div class="form-group">
                    <div class="input-wrapper passxword-wrapper">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>
                <div class="form-options">
                    <div class="remember-wrapper">
                        <label for="remember">Remember me</label>
                        <input type="checkbox" id="remember" name="remember">
                        <span class="checkbox-custom">Keep me signed in</span>
                    </div>
                </div>
                <button type="submit" class="login-btn">Sign In</button>
            </form>

            <div class="divider">
                <span>or sign in with</span>
            </div>
            <div class="soc-options">
                <button type="button" class="soc-btn"> <a href="#" class="fa-brands fa-google"></a>Google</button>
                <button type="button" class="soc-btn"> <a href="#" class="fa-brands fa-github"></a>Github</button>
            </div>
            <div class="footer-links">
                <p>Don't have an account? <a href="#">Sign up</a></p>
            </div>
        </div>
    </div>

</body>
</html>
