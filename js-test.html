    <script>

            return number * number;

        // function pow(x, n) {
        //     if (n == 1) {
        //         return x;

        //         return x * pow(x, n - 1);
        //     }
        // }
        function pow(x, n) {
            return (n == 1) ? x : (x * pow(x, n - 1));
        }
        console.log(pow(2, 100)); // Output: 1024


        function fibo(n) {
            // Базовий випадок
            if (n <= 1) {
                return n;
            }
            // Рекурсивний виклик
            return fibo(n - 1) + fibo(n - 2);
        }
        console.log(fibo(10)); // Виведе: 8 (послідовність: 0, 1, 1, 2, 3, 5, 8)

        function fib(n) {
            return n <= 1 ? n : fib(n - 1) + fib(n - 2);
        }
        function getFibonacciSequence(length) {
            const result = [];
            for (let i = 0; i < length; i++) {
                result.push(fib(i));
            }
            return result;
        }
        console.log(getFibonacciSequence(7)); // Виведе: [0, 1, 1, 2, 3, 5, 8]
