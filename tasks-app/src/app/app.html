<main class="main">
  <div class="content">
    <div class="task-container">
      <h1>Мій Список Завдань {{ title() }}</h1>
       <input [(ngModel)]="newTask" placeholder="Нове завдання..." />
      <button (click)="addTask()" class="btn">Додати</button>
      <ul class="task-list">
        <li *ngFor="let task of tasks; let i = index" style="margin: 5px 0;">
          {{ task }}
          <button (click)="deleteTask(i)" class="btn-delete">X</button>
        </li>
      </ul>
    </div>
  </div>
</main>
<router-outlet />
