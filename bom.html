<body>
    <div class="container">
        <h1 id="hell">Hello JavaScript!</h1>

    <h1 id="main-title">Привіт, Світе!</h1>
    <button id="change-btn" onclick="doit()">Змінити заголовок</button>

        console.log(window.innerWidth, window.innerHeight);

        let hello = document.getElementById('hell')

        // document.querySelectorAll('h1')[0].innerHTML = "<i>Hello h1!</i>";
        document.getElementsByTagName('h1')[0].innerHTML = "<i>Hello tag name!</i>";

        function doit() {
            // 1. Пошук елементів на сторінці
            const title = document.getElementById('main-title');
            const button = document.getElementById('change-btn');
            // 2. Зміна текстового вмісту елемента title
            title.textContent = 'Текст успішно змінено через DOM!';
            // 3. Зміна стилів елемента title (робимо колір зеленим)
            title.style.color = '#27ae60';
            // 4. Зміна стилів елемента button
            button.style.backgroundColor = "red";
            button.style.color = "white";
            // 5. Зміна текстового вмісту елемента button
            button.textContent = "All done!";
        };
    </script>
