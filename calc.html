<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const calculator = {
            result: 0,

            read(value) {
                this.result = value;
                return this;
            },
            add(value) {
                this.result += value;
                return this;
            },

            subtract(value) {
                this.result -= value;
                return this;
            },
            multiply(value) {
                this.result *= value;
                return this;
            },
            divide(value) {
                if (value === 0) {
                    console.error("Помилка: Ділення на нуль!");
                    return this;
                }
                this.result /= value;
                return this;
            },
            getResult() {
                return this.result;
            },
            reset() {
                this.result =
                    0;
                return this;
            }

        }

        const finalResult = calculator
            .read(10) // Початкове значення 10
            .add(5) // 10 + 5 = 15
            .subtract(3) // 15 - 3 = 12
            .multiply(2) // 12 * 2 = 24
            .divide(4) // 24 / 4 = 6
            .getResult(); // Отримання фінального результату
        console.log(finalResult); // Виведе: 6
    </script>
</body>

</html>
