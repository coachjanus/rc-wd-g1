<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="slider.css">
</head>

<body>
    <div id="main-gallery" class="gallery-container">
        <div class="main-view-wrapper">
            <button class="nav-btn prev-btn">❮</button>
            <div class="main-view" width="400">
                <img class="main-photo" src="/images/product-5.jpg" alt="Головне фото" width="400">
            </div>
            <button class="nav-btn next-btn">❯</button>
        </div>
        <div class="thumbnails-list">
            <img class="thumb active" src="/images/product-5.jpg" data-large="/images/product-5.jpg" data-index="0"
                alt="Прев'ю 1">
            <img class="thumb" src="/images/product-6.jpg" data-large="/images/product-6.jpg" data-index="1"
                alt="Прев'ю 2">
            <img class="thumb" src="/images/product-7.jpg" data-large="/images/product-7.jpg" data-index="2"
                alt="Прев'ю 3">
            <img class="thumb" src="/images/product-8.jpg" data-large="/images/product-8.jpg" data-index="3"
                alt="Прев'ю 4">
        </div>
    </div>

    <script src="slider.js"></script>
</body>

</html>
